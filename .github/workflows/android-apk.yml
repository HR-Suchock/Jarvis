name: Build Jarvis phone APK
# Run it from the Actions tab (Run workflow). It signs the APK with YOUR key, kept in GitHub secrets, so every build installs over the last one.
on:
  workflow_dispatch:
  push:
    tags: ['phone-v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android build tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q dalvik-exchange
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "SDK=$SDK" >> "$GITHUB_ENV"
      - name: Build and sign
        working-directory: phone
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ] || { echo "Add the 4 secrets first: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see phone/SIGNING.md)"; exit 1; }
          export ANDROID_JAR="$SDK/platforms/android-34/android.jar"
          export AAPT2="$SDK/build-tools/34.0.0/aapt2"
          export PATH="$SDK/build-tools/34.0.0:$PATH"
          export DX=dalvik-exchange
          bash build.sh
          apksigner verify --print-certs build/Jarvis.apk | grep -E "SHA-256|Verified using v2"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-phone-apk
          path: phone/build/Jarvis.apk
