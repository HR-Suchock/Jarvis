name: Build Jarvis APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Locate Android tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null
          fi
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          echo "ANDROID_JAR=$SDK/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/$BT" >> "$GITHUB_PATH"
          # build.sh expects the old "dx" tool; build-tools ship d8 instead, so wrap it
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/dx" <<WRAP
          #!/usr/bin/env bash
          out=""; in=""
          for a in "\$@"; do case "\$a" in --output=*) out="\${a#--output=}";; --*) ;; *) in="\$a";; esac; done
          tmp=\$(mktemp -d)
          "$SDK/build-tools/$BT/d8" --min-api 24 --lib "$SDK/platforms/android-34/android.jar" --output "\$tmp" \$(find "\$in" -name '*.class')
          mv "\$tmp/classes.dex" "\$out"
          WRAP
          sed -i 's/^          //' "$HOME/bin/dx"
          chmod +x "$HOME/bin/dx"
          echo "DX=$HOME/bin/dx" >> "$GITHUB_ENV"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore your signing key (if you added it as a secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > jarvis-release.keystore
            echo "Using your saved keystore."
            echo "KEY_FROM_SECRET=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - a NEW signing key will be created. It will NOT install over a Jarvis that was signed with a different key."
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'change-me-please' }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: build/Jarvis.apk

      - name: Save the newly created signing key (only if you had none)
        if: ${{ env.KEY_FROM_SECRET != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: NEW-signing-key-keep-private
          path: jarvis-release.keystore
          retention-days: 1
