name: Build Jarvis for Windows
on:
  workflow_dispatch:
  push:
    tags: ['pc-v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore build-tool cache
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: tools-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.run_id }}
          restore-keys: tools-${{ runner.os }}-
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build installer exe (keeps retrying while the download server is busy)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            npm run dist && exit 0
            echo "Build failed (attempt $i), waiting before retry"
            sleep 60
          done
          exit 1
      - name: Save build-tool cache (even if the build failed, so the next run is faster)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: tools-${{ runner.os }}-${{ hashFiles('package.json') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: |
            dist/*.exe
