name: Build Jarvis for Windows
on:
  workflow_dispatch:
  push:
    tags: ['pc-v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        working-directory: pc
        run: npm install
      - name: Test
        working-directory: pc
        run: npm test
      - name: Build installer and portable exe
        working-directory: pc
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: |
            pc/dist/*.exe
