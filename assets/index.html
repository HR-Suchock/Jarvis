<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02070d">
<link rel="icon" href="data:,">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-scan"></div>

<!-- ============ BOOT SEQUENCE ============ -->
<div id="boot">
  <svg class="boot-rings" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="92" class="r1"/>
    <circle cx="100" cy="100" r="76" class="r2"/>
    <circle cx="100" cy="100" r="58" class="r3"/>
    <circle cx="100" cy="100" r="14" class="core"/>
  </svg>
  <div class="boot-title">J.A.R.V.I.S</div>
  <div class="boot-sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
  <div id="boot-log"></div>
  <div class="boot-skip">tap to skip</div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app">
  <header class="top">
    <div class="brand"><span class="dot"></span>J.A.R.V.I.S</div>
    <div class="stats">
      <span id="clock" class="chip">--:--</span>
      <span id="provider-chip" class="chip chip-btn" title="Active AI">NO LINK</span>
    </div>
    <button id="btn-settings" class="icon-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4.9a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-.9-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-.9c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.4.9 2-3.4-2.2-1.6z"/></svg>
    </button>
  </header>

  <section class="stage" id="stage">
    <canvas id="orb"></canvas>
    <div class="hud-corner tl"></div><div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div><div class="hud-corner br"></div>
    <div class="hud-read tl-r" aria-hidden="true"><span id="hud-batt">BATT --</span><span id="hud-date">---</span></div>
    <div class="hud-read tr-r" aria-hidden="true"><span id="hud-link">LINK --</span><span id="hud-cmds">CMD 0</span></div>
    <div class="mini l" id="miniL" aria-hidden="true"><div class="mini-h"><b></b><b></b><b></b></div><div class="mini-in" id="miniLi"></div><div class="mini-bars" id="miniLb"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="mini r" id="miniR" aria-hidden="true"><div class="mini-h"><b></b><b></b><b></b></div><div class="mini-in" id="miniRi"></div><div class="mini-bars" id="miniRb"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="status-wrap">
      <div id="status" class="status">STANDING BY</div>
      <div id="partial" class="partial"></div>
    </div>
  </section>

  <section id="log" class="log" aria-live="polite"></section>

  <div class="chips" id="chips"></div>

  <footer class="dock">
    <div class="input-wrap">
      <input id="text" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" placeholder="Type a command or ask anything…">
      <button id="btn-send" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 20 4l-4.5 16-3.6-6.4L3 11.5z"/></svg>
      </button>
    </div>
    <button id="btn-mic" class="mic" aria-label="Speak">
      <span class="mic-ring"></span><span class="mic-ring r2"></span>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </footer>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings" class="settings" aria-hidden="true">
  <div class="set-head">
    <button id="set-back" class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="set-title">SYSTEM CONFIG</div>
    <span class="saved" id="saved">SAVED</span>
  </div>
  <div class="set-body" id="set-body"></div>
</div>

<div id="toast" class="toast"></div>

<script src="js/orb.js"></script>
<script src="js/pc-bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
